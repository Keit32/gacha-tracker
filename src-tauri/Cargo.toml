[package]
name = "gacha-tracker"
version = "0.1.0"
description = "Local-first desktop tracker for gacha games: archive your pull history, endgame runs, and builds."
authors = ["Keit"]
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/Keit32/gacha-tracker"
readme = "../README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gacha_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Stricter set; the negative priority lets individual lints override the group
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[package.metadata.cargo-machete]
ignored = ["serde", "serde_json"]